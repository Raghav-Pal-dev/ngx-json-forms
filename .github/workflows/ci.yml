name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint and test
        run: npx nx run-many --target=lint,test --all

      # Schematics must be compiled before ng-packagr's `assets` glob can
      # pick them up. (Two steps, not dependsOn — see release.yml for why.)
      - name: Build schematics
        run: npx nx run primeng:build-schematics

      - name: Build all projects
        run: npx nx run-many --target=build --all
