name: Deploy demo to GitHub Pages

# Builds apps/demo and publishes it to GitHub Pages on every push to main
# (and on a manual trigger from the Actions tab).
#
# Live URL once this runs at least once: https://raghav-pal-dev.github.io/ngx-json-forms/
#
# One-time setup, after this workflow first reaches the deploy step:
#   GitHub repo → Settings → Pages → Source: "GitHub Actions"
#   (You only have to do this once. After that, every push to main updates
#   the site.)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you run it from the Actions tab on demand

# Grant the workflow the permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy at a time; if a second push lands while the
# first is running, the in-flight one gets cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `--base-href=/ngx-json-forms/` so the bundled JS/CSS resolve correctly
      # under the repo-name subpath that GitHub Pages serves from.
      - name: Build demo
        run: npx nx build demo --configuration=production --base-href=/ngx-json-forms/

      # GitHub Pages does client-side SPA fallback only if a 404.html exists.
      # The demo is a single-page app with no routes, but this future-proofs
      # us if you ever add the router.
      - name: Add SPA 404 fallback
        run: cp dist/apps/demo/browser/index.html dist/apps/demo/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
